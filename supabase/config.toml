# Supabase CLI project configuration.
#
# Created so `supabase link` and `supabase db push` work against this repo.
# The project ref and any secrets live in .env / CI, never here.

project_id = "mdc-hackathon-ledger"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:4000", "http://localhost:5173"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
